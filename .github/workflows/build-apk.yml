name: Build Bubble Head Bounce APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir game
          unzip -q BubbleHeadBounce_Android_Project.zip -d game

      - name: Fix Java type
        run: |
          sed -i 's/spawnClock=interval;/spawnClock=(long) interval;/' game/app/src/main/java/com/bubbleheadbounce/game/GameView.java

      - name: Build APK
        working-directory: game
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleHeadBounce-debug-apk
          path: game/app/build/outputs/apk/debug/app-debug.apk
